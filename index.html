<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopf Link Visualisation with Zoom</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Подключаем Three.js и OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Создание сцены и камеры
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Добавляем возможность приближения (Zoom) и вращения
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Плавность вращения
        controls.dampingFactor = 0.05;
        controls.minDistance = 1;      // Минимальное приближение
        controls.maxDistance = 20;     // Максимальное отдаление

        // 3. Функция создания колец из частиц
        function createParticleTorus(radius, tubeRadius, particleCount, colorHex) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI * 2;

                const r = tubeRadius + (Math.random() - 0.5) * 0.2;
                const x = (radius + r * Math.cos(v)) * Math.cos(u);
                const y = (radius + r * Math.cos(v)) * Math.sin(u);
                const z = r * Math.sin(v);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: colorHex,
                size: 0.025,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            return new THREE.Points(geometry, material);
        }

        // 4. Создаем два кольца (Hopf Link)
        const count = 40000;
        const mainRadius = 2.0;
        const tubeRadius = 0.4;

        const blueRing = createParticleTorus(mainRadius, tubeRadius, count, 0x00d2ff);
        scene.add(blueRing);

        const yellowRing = createParticleTorus(mainRadius, tubeRadius, count, 0xffd700);
        yellowRing.rotation.x = Math.PI / 2;
        yellowRing.position.y = 1.2;
        scene.add(yellowRing);

        camera.position.z = 6;

        // 5. Анимация
        function animate() {
            requestAnimationFrame(animate);

            // Автоматическое вращение спорных колец
            blueRing.rotation.y += 0.003;
            blueRing.rotation.x += 0.002;

            yellowRing.rotation.y += 0.003;
            yellowRing.rotation.x += 0.002;

            // Обновление управления
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // Адаптация под размер экрана
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
